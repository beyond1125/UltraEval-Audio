# ADDED BY US -- strided shard views so one benchmark can be split across GPU PROCESSES.
# The rollout is GIL-bound so UEA's thread pool does not scale; --limit is prefix-only, which
# left speech-web-questions a ~7.6 h serial floor. Shards partition exactly (res[k::N]);
# benchmark total = sum(matches)/sum(n) over shards == the unsharded denominator.
# Upstream dataset entries (llama_questions.yaml, triviaqa.yaml, webQ.yaml) are UNTOUCHED.

speech-web-questions-s2t-sh0of5:
  class: audio_evals.dataset.sharded_hf.ShardedHuggingface
  args:
    default_task: loose-aqa
    name: TwinkStart/speech-web-questions
    ref_col: answers
    split: test
    shard_id: 0
    num_shards: 5

